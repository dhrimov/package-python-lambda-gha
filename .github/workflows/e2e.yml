name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # AWS Lambda's unzipped deployment package limit, in bytes.
  AWS_LAMBDA_MAX_UNZIP_SIZE: 262144000

jobs:
  single:
    name: single (python ${{ matrix.python-version }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform: [aarch64-manylinux2014, x86_64-manylinux2014]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package the single-lambda fixture
        id: package
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: ${{ matrix.python-version }}
          platform: ${{ matrix.platform }}

      # This asserts on the path the action reports, not on one rebuilt here.
      # A test that works out the filename itself would pass even if the action
      # reported the wrong one.
      - name: Assert the reported zip exists at an absolute path
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        run: |
          [[ "$ZIP_PATH" == /* ]] || { echo "zip-path is not absolute: $ZIP_PATH"; exit 1; }
          test -f "$ZIP_PATH"

      # The assertion that makes both matrix axes mean something. It reacts to
      # platform and python-version at once, and it is what would catch a
      # regression that dropped --python-platform from the uv pip install line.
      # Without that flag, both platforms would resolve the same py3-none-any
      # wheels and pass.
      - name: Assert the extension module's ABI tag matches the request
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          architecture="${PLATFORM%%-*}"
          expected="orjson/orjson.cpython-${PYTHON_VERSION//./}-$architecture-linux-gnu.so"
          if ! unzip -l "$ZIP_PATH" | grep -qF "$expected"; then
            echo "expected $expected in the package, got:"
            unzip -l "$ZIP_PATH"
            exit 1
          fi

      # The `false` half of the nested-zip assertion. The `true` half is the
      # nested job below.
      - name: Assert the fixture stays under AWS's unzipped limit
        env:
          NESTED_ZIP: ${{ steps.package.outputs.nested-zip }}
          UNCOMPRESSED_BYTES: ${{ steps.package.outputs.uncompressed-bytes }}
        run: |
          [[ "$NESTED_ZIP" == "false" ]] || { echo "nested-zip fallback kicked in unexpectedly"; exit 1; }
          ((UNCOMPRESSED_BYTES < AWS_LAMBDA_MAX_UNZIP_SIZE))

  newer-glibc:
    # Its own job, not more values on single's platform axis: the glibc level
    # does not interact with python-version, so one version is enough. 3.13,
    # because 3.11 rejects these platforms. orjson ships manylinux2014 wheels,
    # which these targets install too, so this proves uv takes the target and
    # resolves the right architecture - not that a manylinux_2_28-only wheel
    # gets picked up.
    name: newer glibc (python 3.13, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-manylinux_2_28
          - x86_64-manylinux_2_28
          - aarch64-manylinux_2_34
          - x86_64-manylinux_2_34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package the single-lambda fixture
        id: package
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.13"
          platform: ${{ matrix.platform }}

      - name: Assert the reported zip exists at an absolute path
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        run: |
          [[ "$ZIP_PATH" == /* ]] || { echo "zip-path is not absolute: $ZIP_PATH"; exit 1; }
          test -f "$ZIP_PATH"

      - name: Assert the extension module's ABI tag matches the request
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          architecture="${PLATFORM%%-*}"
          expected="orjson/orjson.cpython-313-$architecture-linux-gnu.so"
          if ! unzip -l "$ZIP_PATH" | grep -qF "$expected"; then
            echo "expected $expected in the package, got:"
            unzip -l "$ZIP_PATH"
            exit 1
          fi

      - name: Assert the fixture stays under AWS's unzipped limit
        env:
          NESTED_ZIP: ${{ steps.package.outputs.nested-zip }}
          UNCOMPRESSED_BYTES: ${{ steps.package.outputs.uncompressed-bytes }}
        run: |
          [[ "$NESTED_ZIP" == "false" ]] || { echo "nested-zip fallback kicked in unexpectedly"; exit 1; }
          ((UNCOMPRESSED_BYTES < AWS_LAMBDA_MAX_UNZIP_SIZE))

  nested:
    # Python 3.13 only: the large fixture's dependencies ship no cp314
    # manylinux2014 wheels, and 3.13 is enough to prove the fallback. Both
    # platforms, because each resolves its own wheels and its own sizes.
    name: nested zip (python 3.13, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [aarch64-manylinux2014, x86_64-manylinux2014]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package the over-the-limit fixture
        id: package
        uses: ./
        with:
          input-path: tests/fixtures/large
          output-path: dist
          python-version: "3.13"
          platform: ${{ matrix.platform }}

      # uncompressed-bytes is the size before nesting, so it has to be over the
      # limit for the fallback to mean anything. The outer zip holds the inner
      # one stored, not compressed, so its size on disk is close to the
      # unzipped size AWS measures, and that is what has to fit.
      - name: Assert the nested-zip fallback kicked in
        env:
          NESTED_ZIP: ${{ steps.package.outputs.nested-zip }}
          UNCOMPRESSED_BYTES: ${{ steps.package.outputs.uncompressed-bytes }}
          PACKAGE_SIZE_BYTES: ${{ steps.package.outputs.package-size-bytes }}
        run: |
          [[ "$NESTED_ZIP" == "true" ]] || { echo "nested-zip fallback did not kick in"; exit 1; }
          ((UNCOMPRESSED_BYTES > AWS_LAMBDA_MAX_UNZIP_SIZE)) ||
            { echo "fixture is not over the unzipped limit: $UNCOMPRESSED_BYTES bytes"; exit 1; }
          ((PACKAGE_SIZE_BYTES < AWS_LAMBDA_MAX_UNZIP_SIZE)) ||
            { echo "nested zip is not under the limit: $PACKAGE_SIZE_BYTES bytes"; exit 1; }

      # The layout the loader depends on: the inner zip and an __init__.py that
      # extracts it, both in the entrypoint package, which the packager names
      # after the distribution.
      - name: Assert the zip holds only the inner zip and its loader
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        run: |
          expected="$(printf '%s\n' large_lambda/.dependencies.zip large_lambda/__init__.py)"
          actual="$(unzip -Z1 "$ZIP_PATH" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "expected entries:"; echo "$expected"
            echo "actual entries:"; echo "$actual"
            exit 1
          fi

  multi:
    # One job, not a third matrix axis. This covers the caller-driven matrix
    # pattern, not the packaging pipeline, so running it across every Python
    # and platform would add cost without telling us anything new.
    name: multi (caller-driven, one call per lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package the orders lambda
        id: orders
        uses: ./
        with:
          input-path: tests/fixtures/multi/orders
          output-path: dist
          python-version: "3.13"
          platform: aarch64-manylinux2014

      - name: Package the payments lambda
        id: payments
        uses: ./
        with:
          input-path: tests/fixtures/multi/payments
          output-path: dist
          python-version: "3.13"
          platform: aarch64-manylinux2014

      # Both steps share one output-path on purpose. It is what would catch two
      # fixture projects sharing a name by accident: the packager takes the
      # zip's filename from that name, so the second would overwrite the
      # first.
      - name: Assert both lambdas survive a shared output path
        env:
          ORDERS_ZIP: ${{ steps.orders.outputs.zip-path }}
          PAYMENTS_ZIP: ${{ steps.payments.outputs.zip-path }}
        run: |
          [[ "$ORDERS_ZIP" != "$PAYMENTS_ZIP" ]] || { echo "both lambdas packaged to $ORDERS_ZIP"; exit 1; }
          test -f "$ORDERS_ZIP"
          test -f "$PAYMENTS_ZIP"

  reproducible:
    name: the same inputs give the same hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package once
        id: first
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.13"
          platform: aarch64-manylinux2014

      - name: Package again
        id: second
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.13"
          platform: aarch64-manylinux2014

      - name: Assert both runs report the same hash
        env:
          FIRST: ${{ steps.first.outputs.zip-sha256 }}
          SECOND: ${{ steps.second.outputs.zip-sha256 }}
        run: |
          echo "first:  $FIRST"
          echo "second: $SECOND"
          [[ -n "$FIRST" && "$FIRST" == "$SECOND" ]]

  build-dir:
    name: build-dir moves the scratch directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stands in for a project's own build/ directory, which the default
      # build-dir would delete.
      - name: Put a file in <input-path>/build
        run: |
          mkdir -p tests/fixtures/single/build
          touch tests/fixtures/single/build/keep.txt

      - name: Package with build-dir outside the project
        id: package
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          build-dir: ${{ runner.temp }}/lambda-build
          python-version: "3.13"
          platform: aarch64-manylinux2014

      - name: Assert the project's build/ was left alone and the scratch dir is gone
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
          BUILD_DIR: ${{ runner.temp }}/lambda-build
        run: |
          test -f "$ZIP_PATH"
          test -f tests/fixtures/single/build/keep.txt || { echo "<input-path>/build was touched"; exit 1; }
          test ! -e "$BUILD_DIR" || { echo "build-dir was not cleaned up: $BUILD_DIR"; exit 1; }

  guard-rails:
    name: unsupported inputs fail fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package for an unsupported platform
        id: bad-platform
        continue-on-error: true
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.13"
          platform: aarch64-manylinux_2_31

      - name: Package for a runtime too old for the platform's glibc
        id: bad-pair
        continue-on-error: true
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.11"
          platform: aarch64-manylinux_2_28

      - name: Package for an unsupported runtime
        id: bad-python
        continue-on-error: true
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.9"
          platform: aarch64-manylinux2014

      # tests/ is a parent of input-path. Were it accepted, cleanup would
      # delete the fixture along with it, which the assertion below checks.
      - name: Package with build-dir set to a parent of input-path
        id: bad-build-dir
        continue-on-error: true
        uses: ./
        with:
          input-path: tests/fixtures/single
          # Not dist: build.sh creates the output directory before it checks
          # build-dir, so this case cannot assert that no directory appeared.
          output-path: dist-bad-build-dir
          build-dir: tests
          python-version: "3.13"
          platform: aarch64-manylinux2014

      - name: Assert all four were rejected without producing a package
        env:
          BAD_PLATFORM: ${{ steps.bad-platform.outcome }}
          BAD_PAIR: ${{ steps.bad-pair.outcome }}
          BAD_PYTHON: ${{ steps.bad-python.outcome }}
          BAD_BUILD_DIR: ${{ steps.bad-build-dir.outcome }}
        run: |
          [[ "$BAD_PLATFORM" == "failure" ]] || { echo "an unsupported platform was accepted"; exit 1; }
          [[ "$BAD_PAIR" == "failure" ]] || { echo "python 3.11 with manylinux_2_28 was accepted"; exit 1; }
          [[ "$BAD_PYTHON" == "failure" ]] || { echo "an unsupported python-version was accepted"; exit 1; }
          [[ "$BAD_BUILD_DIR" == "failure" ]] || { echo "a build-dir above input-path was accepted"; exit 1; }
          test -f tests/fixtures/single/pyproject.toml || { echo "the fixture was deleted"; exit 1; }
          test ! -e dist
          ! compgen -G 'dist-bad-build-dir/*.zip' || { echo "a package was produced"; exit 1; }

      # The step outcomes above only show that a run failed, not why. These
      # call build.sh directly, so each refusal can be checked against the
      # path it names. They need uv on PATH: build.sh checks for its tools
      # before it gets to build-dir.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Assert each unsafe build-dir is refused for the right reason
        run: |
          expect_refusal() {
            local want="$1"
            shift
            if ./build.sh --input tests/fixtures/single --python 3.13 \
              --platform aarch64-manylinux2014 "$@" 2>err.txt; then
              echo "accepted: $*"
              exit 1
            fi
            grep -qF "$want" err.txt || {
              echo "refused for the wrong reason: $*"
              cat err.txt
              exit 1
            }
          }

          expect_refusal "a parent of input-path " --output guard-out --build-dir tests/fixtures/single
          expect_refusal "a parent of output-path " --output guard-out --build-dir guard-out
          expect_refusal "a parent of output-path " --output guard-out/zip --build-dir guard-out
          expect_refusal "a parent of RUNNER_TEMP " --output guard-out --build-dir "$RUNNER_TEMP"

          # A symlink must not hide that the build-dir is a parent of input-path.
          ln -s "$PWD/tests" "$RUNNER_TEMP/tests-link"
          expect_refusal "a parent of input-path " --output guard-out --build-dir "$RUNNER_TEMP/tests-link/fixtures"

          # A build-dir that is itself a symlink is refused outright: cleanup
          # would delete what it points to, not just the link.
          mkdir -p "$RUNNER_TEMP/shared-cache"
          ln -s "$RUNNER_TEMP/shared-cache" "$RUNNER_TEMP/build-link"
          expect_refusal "is a symlink" --output guard-out --build-dir "$RUNNER_TEMP/build-link"
          # Spellings that make the symlink test follow the link, unless
          # build.sh strips them first.
          expect_refusal "is a symlink" --output guard-out --build-dir "$RUNNER_TEMP/build-link//"
          expect_refusal "is a symlink" --output guard-out --build-dir "$RUNNER_TEMP/build-link/."

          # The runner's real home is a parent of the workspace, so it would be
          # refused as a parent of input-path first. A stand-in tests HOME alone.
          mkdir -p "$RUNNER_TEMP/fake-home"
          HOME="$RUNNER_TEMP/fake-home" \
            expect_refusal "a parent of HOME " --output guard-out --build-dir "$RUNNER_TEMP/fake-home"

          # Only an action step sets GITHUB_ACTION_PATH, so stand one up here.
          mkdir -p "$RUNNER_TEMP/fake-action"
          GITHUB_ACTION_PATH="$RUNNER_TEMP/fake-action" \
            expect_refusal "a parent of GITHUB_ACTION_PATH " --output guard-out --build-dir "$RUNNER_TEMP/fake-action"

          test -f tests/fixtures/single/pyproject.toml || { echo "the fixture was deleted"; exit 1; }

  artifact:
    # Two jobs that differ only by platform. upload-artifact errors on
    # same-name collisions, so this job passing is what proves the derived
    # default is unique per platform and not just per project.
    name: upload (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [aarch64-manylinux2014, x86_64-manylinux2014]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package and upload
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.13"
          platform: ${{ matrix.platform }}
          upload-artifact: "true"
          artifact-retention-days: "1"

  artifact-default:
    # A different python-version from the upload job on purpose. A stray
    # artifact from here would then carry a name the assertion below does not
    # expect, instead of colliding with one it does.
    name: upload is off by default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package with upload-artifact left at its default
        uses: ./
        with:
          input-path: tests/fixtures/single
          output-path: dist
          python-version: "3.12"
          platform: aarch64-manylinux2014

  artifact-assert:
    name: artifacts download and have distinct names
    runs-on: ubuntu-latest
    needs: [artifact, artifact-default]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download every artifact this run produced
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded

      - name: Assert exactly the two derived names, each holding its zip
        run: |
          expected="$(printf '%s\n' \
            single_lambda-aarch64-manylinux2014-py3.13 \
            single_lambda-x86_64-manylinux2014-py3.13)"
          actual="$(ls downloaded)"
          if [[ "$actual" != "$expected" ]]; then
            echo "expected artifacts:"; echo "$expected"
            echo "actual artifacts:"; echo "$actual"
            exit 1
          fi
          test -f "downloaded/single_lambda-aarch64-manylinux2014-py3.13/single_lambda.zip"
          test -f "downloaded/single_lambda-x86_64-manylinux2014-py3.13/single_lambda.zip"
