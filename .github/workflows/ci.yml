name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Every other run gets a
# group of its own, so runs on main always finish - a shared group would
# still replace a pending run with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: shellcheck + bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # Comes preinstalled on the GitHub-hosted Ubuntu images.
        run: shellcheck build.sh cache-glob.sh

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bats

      - name: bats
        run: bats tests
