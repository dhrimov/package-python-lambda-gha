[project]
name = "common"
version = "0.1.0"
description = "Shared library of the workspace fixture for the action's end-to-end tests."
requires-python = ">=3.11"
dependencies = [
    # A compiled dependency on purpose - see the single fixture for why. Both
    # lambdas get it only through this library.
    "orjson==3.12.0",
    # A path dependency that is not a workspace member, so the lambdas get a
    # second local package, and only through this library.
    "textutil",
]

[tool.uv.sources]
textutil = { path = "../../vendor/textutil" }

[build-system]
requires = ["uv_build>=0.10.0,<0.14"]
build-backend = "uv_build"
