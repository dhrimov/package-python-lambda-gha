[project]
name = "payments-lambda"
version = "0.1.0"
description = "Workspace member of the workspace fixture for the action's end-to-end tests."
requires-python = ">=3.11"
dependencies = [
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_lambda"]
