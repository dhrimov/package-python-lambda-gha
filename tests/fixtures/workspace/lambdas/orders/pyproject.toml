[project]
name = "orders-lambda"
version = "0.1.0"
description = "Workspace member of the workspace fixture for the action's end-to-end tests."
requires-python = ">=3.11"
dependencies = [
    "common",
    # A compiled dependency only this lambda uses, so the e2e job can check
    # that the payments zip does not carry another member's dependencies.
    "markupsafe==3.0.3",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_lambda"]
